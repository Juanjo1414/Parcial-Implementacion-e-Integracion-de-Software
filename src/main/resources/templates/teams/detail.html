<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: common-head(${team.name})"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 th:text="${team.name}">Equipo</h1>
        <form sec:authorize="hasRole('ADMIN')" th:action="@{/teams/{id}/delete(id=${team.id})}" method="post"
              onsubmit="return confirm('¿Eliminar este equipo?');">
            <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar equipo</button>
        </form>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <p><strong>Coach:</strong> <span th:text="${team.coachName}">-</span></p>
            <p><strong>Estado:</strong>
                <span class="badge" th:classappend="${team.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${team.status}">estado</span>
            </p>
            <p><strong>Récord:</strong> <span th:text="${team.wins}">0</span> victorias / <span th:text="${team.losses}">0</span> derrotas</p>
        </div>
    </div>

    <div class="card mb-3" sec:authorize="hasRole('ADMIN')">
        <div class="card-header">Agregar miembro</div>
        <div class="card-body">
            <p class="text-muted small" th:if="${availableCompetitors.isEmpty()}">
                No hay competidores sin equipo disponibles.
            </p>
            <form th:unless="${availableCompetitors.isEmpty()}" class="row g-2"
                  th:action="@{/teams/{teamId}/members/__PLACEHOLDER__(teamId=${team.id})}" method="post"
                  id="addMemberForm">
                <!-- Truco simple: el select cambia el "action" del form con JS,
                     ya que Thymeleaf no soporta variables dentro del path
                     directamente desde un <select> sin recargar la página. -->
                <div class="col-md-8">
                    <select class="form-select" id="competitorSelect">
                        <option th:each="c : ${availableCompetitors}" th:value="${c.id}"
                                th:text="${c.nickname} + ' (' + ${c.name} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn btn-primary w-100" onclick="submitAddMember()">Agregar</button>
                </div>
            </form>
            <script th:inline="javascript">
                function submitAddMember() {
                    const teamId = /*[[${team.id}]]*/ '';
                    const competitorId = document.getElementById('competitorSelect').value;
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/teams/' + teamId + '/members/' + competitorId;
                    document.body.appendChild(form);
                    form.submit();
                }
            </script>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Miembros (<span th:text="${team.members.size()}">0</span>)</div>
        <div class="card-body p-0">
            <p class="empty-state mb-0" th:if="${team.members.isEmpty()}">
                Este equipo todavía no tiene miembros.
            </p>
            <table class="table mb-0" th:unless="${team.members.isEmpty()}">
                <tbody>
                <tr th:each="m : ${team.members}">
                    <td th:text="${m.nickname}">nickname</td>
                    <td th:text="${m.name}">nombre</td>
                    <td class="text-end" sec:authorize="hasRole('ADMIN')">
                        <form th:action="@{/teams/{teamId}/members/{competitorId}/remove(teamId=${team.id}, competitorId=${m.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('¿Quitar a ' + '[[${m.nickname}]]' + ' del equipo?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Quitar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
