<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: common-head('Inscripciones')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}">
        <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <p><a th:href="@{/races/{id}(id=${race.id})}"><i class="bi bi-arrow-left"></i> Volver a la carrera</a></p>
    <h1 class="mb-4">Inscripciones — <span th:text="${race.name}">carrera</span></h1>

    <!-- Formulario de nueva inscripción: radio buttons para elegir competidor
         O equipo (XOR), coherente con la regla de negocio del backend. -->
    <div class="card mb-3" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')" th:if="${race.status.name() == 'OPEN_FOR_REGISTRATION'}">
        <div class="card-header">Nueva inscripción</div>
        <div class="card-body">
            <form th:action="@{/races/{id}/registrations(id=${race.id})}" method="post" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="regType" id="typeCompetitor" value="competitor" checked onclick="toggleRegType()">
                        <label class="form-check-label" for="typeCompetitor">Competidor individual</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="regType" id="typeTeam" value="team" onclick="toggleRegType()">
                        <label class="form-check-label" for="typeTeam">Equipo</label>
                    </div>
                </div>
                <div class="col-md-6" id="competitorSelectWrapper">
                    <select name="competitorId" class="form-select">
                        <option th:each="c : ${competitors}" th:value="${c.id}" th:text="${c.nickname} + ' (' + ${c.status} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-6 d-none" id="teamSelectWrapper">
                    <select name="teamId" class="form-select">
                        <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Inscribir</button>
                </div>
            </form>
            <script>
                function toggleRegType() {
                    const isTeam = document.getElementById('typeTeam').checked;
                    document.getElementById('competitorSelectWrapper').classList.toggle('d-none', isTeam);
                    document.getElementById('teamSelectWrapper').classList.toggle('d-none', !isTeam);
                    // Deshabilitar el select oculto para que el navegador no lo envíe igual.
                    document.querySelector('#competitorSelectWrapper select').disabled = isTeam;
                    document.querySelector('#teamSelectWrapper select').disabled = !isTeam;
                }
            </script>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <p class="empty-state mb-0" th:if="${registrations.isEmpty()}">Aún no hay inscripciones.</p>
            <table class="table mb-0" th:unless="${registrations.isEmpty()}">
                <thead class="table-light"><tr><th>Participante</th><th>Posición</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="reg : ${registrations}">
                    <td th:text="${reg.competitorNickname} ?: ${reg.teamName}">participante</td>
                    <td th:text="${reg.startingPosition}">1</td>
                    <td>
                            <span class="badge"
                                  th:classappend="${reg.status.name() == 'APPROVED'} ? 'bg-success' : (${reg.status.name() == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                  th:text="${reg.status}">estado</span>
                    </td>
                    <td class="text-end" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')">
                            <span th:if="${reg.status.name() == 'PENDING'}">
                                <form th:action="@{/races/{raceId}/registrations/{id}/approve(raceId=${race.id}, id=${reg.id})}" method="post" class="d-inline">
                                    <button class="btn btn-sm btn-outline-success">Aprobar</button>
                                </form>
                                <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                        th:data-bs-target="'#rejectModal-' + ${reg.id}">Rechazar</button>
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Un modal de rechazo por cada inscripción pendiente, para pedir el motivo obligatorio -->
    <div th:each="reg : ${registrations}" th:if="${reg.status.name() == 'PENDING'}">
        <div class="modal fade" th:id="'rejectModal-' + ${reg.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/races/{raceId}/registrations/{id}/reject(raceId=${race.id}, id=${reg.id})}" method="post">
                        <div class="modal-header"><h5 class="modal-title">Rechazar inscripción</h5></div>
                        <div class="modal-body">
                            <label class="form-label">Motivo (obligatorio)</label>
                            <textarea name="reason" class="form-control" required></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-danger">Rechazar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
