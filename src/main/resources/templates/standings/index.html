<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head('Standings')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <h1 class="mb-4">Tabla de posiciones</h1>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><i class="bi bi-person-badge"></i> Competidores</div>
                <div class="card-body p-0">
                    <p class="empty-state mb-0" th:if="${competitorStandings.isEmpty()}">Sin resultados todavía.</p>
                    <table class="table mb-0" th:unless="${competitorStandings.isEmpty()}">
                        <thead class="table-light"><tr><th>#</th><th>Nickname</th><th>Puntos</th><th>V</th></tr></thead>
                        <tbody>
                        <tr th:each="s, iter : ${competitorStandings}">
                            <td th:text="${iter.count}">1</td>
                            <td th:text="${s.nickname}">nickname</td>
                            <td><strong th:text="${s.totalPoints}">0</strong></td>
                            <td th:text="${s.wins}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header"><i class="bi bi-flag"></i> Equipos</div>
                <div class="card-body p-0">
                    <p class="empty-state mb-0" th:if="${teamStandings.isEmpty()}">Sin resultados todavía.</p>
                    <table class="table mb-0" th:unless="${teamStandings.isEmpty()}">
                        <thead class="table-light"><tr><th>#</th><th>Equipo</th><th>Puntos</th><th>V</th></tr></thead>
                        <tbody>
                        <tr th:each="s, iter : ${teamStandings}">
                            <td th:text="${iter.count}">1</td>
                            <td th:text="${s.teamName}">equipo</td>
                            <td><strong th:text="${s.totalPoints}">0</strong></td>
                            <td th:text="${s.wins}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
