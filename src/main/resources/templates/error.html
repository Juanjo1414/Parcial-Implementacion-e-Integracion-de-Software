<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head('Error')"></head>
<body class="bg-light">
<!-- OJO: aquí NO incluimos el navbar (fragments/layout :: nav) a propósito.
     Un error puede ocurrir en un momento donde el estado de autenticación
     no es confiable de leer (por ejemplo, en medio de una redirección de
     seguridad); el navbar usa sec:authorize, que podría fallar en ese
     contexto. Mantenemos esta página independiente y simple. -->
<main class="container text-center" style="margin-top: 6rem;">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
    <h1 class="mt-3">Ocurrió un error</h1>
    <p class="text-muted">
        Código <span th:text="${status}">500</span> — no pudimos procesar tu solicitud.
        Intenta de nuevo o vuelve al inicio.
    </p>
    <a href="/dashboard" class="btn btn-primary mt-2">Volver al dashboard</a>
</main>
</body>
</html>
