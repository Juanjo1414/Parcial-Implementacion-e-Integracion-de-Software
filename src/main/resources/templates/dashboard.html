<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head('Dashboard')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>

<main class="container">
    <h1 class="mb-4">Dashboard</h1>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card text-center p-3">
                <i class="bi bi-people fs-1 text-primary"></i>
                <h2 th:text="${totalCompetitors}">0</h2>
                <p class="text-muted mb-0">Competidores registrados</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-3">
                <i class="bi bi-flag fs-1 text-success"></i>
                <h2 th:text="${totalTeams}">0</h2>
                <p class="text-muted mb-0">Equipos activos</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-3">
                <i class="bi bi-trophy fs-1 text-warning"></i>
                <h2 th:text="${upcomingRaces.size()}">0</h2>
                <p class="text-muted mb-0">Carreras próximas</p>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Próximas carreras</div>
        <div class="card-body p-0">
            <p class="empty-state mb-0" th:if="${upcomingRaces.isEmpty()}">
                <i class="bi bi-calendar-x fs-2 d-block mb-2"></i>
                No hay carreras abiertas por ahora.
            </p>
            <table class="table table-hover mb-0" th:unless="${upcomingRaces.isEmpty()}">
                <thead class="table-light">
                <tr><th>Nombre</th><th>Fecha</th><th>Estado</th></tr>
                </thead>
                <tbody>
                <tr th:each="race : ${upcomingRaces}">
                    <td th:text="${race.name}">Nombre</td>
                    <td th:text="${#temporals.format(race.scheduledAt, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td>
                        <span class="badge bg-info badge-status" th:text="${race.status}">Estado</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
