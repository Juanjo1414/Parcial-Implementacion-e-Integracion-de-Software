<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: common-head('Carreras')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}">
        <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Carreras</h1>
        <a sec:authorize="hasAnyRole('ADMIN','ORGANIZER')" th:href="@{/races/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva carrera
        </a>
    </div>

    <p class="empty-state" th:if="${races.isEmpty()}">
        <i class="bi bi-flag-fill fs-2 d-block mb-2"></i> No hay carreras registradas.
    </p>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" th:unless="${races.isEmpty()}">
                <thead class="table-light">
                <tr><th>Nombre</th><th>Fecha</th><th>Tipo</th><th>Estado</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${races}">
                    <td th:text="${r.name}">Nombre</td>
                    <td th:text="${#temporals.format(r.scheduledAt, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td th:text="${r.type}">Tipo</td>
                    <td>
                            <span class="badge badge-status"
                                  th:classappend="${r.status.name() == 'COMPLETED'} ? 'bg-success' : (${r.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-info')"
                                  th:text="${r.status}">estado</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/races/{id}(id=${r.id})}" class="btn btn-sm btn-outline-primary">Ver</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
