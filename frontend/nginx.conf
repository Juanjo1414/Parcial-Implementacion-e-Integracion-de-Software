server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reenvía todo lo que empiece por /api al backend, que corre en el
    # servicio "app" dentro de la red interna de Docker Compose. Desde el
    # navegador todo llega al mismo origen, así que no hace falta CORS.
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: cualquier ruta de React Router que no sea un archivo
    # real se resuelve devolviendo index.html, para que el enrutado del
    # lado del cliente pueda tomar el control.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
