<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head('Nuevo equipo')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container" style="max-width: 500px;">
    <h1 class="mb-4">Nuevo equipo</h1>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/teams}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre del equipo</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Coach / responsable</label>
                    <input type="text" name="coachName" class="form-control">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/teams}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Crear equipo</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
