<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head(${isEdit} ? 'Editar competidor' : 'Nuevo competidor')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>

<main class="container" style="max-width: 600px;">
    <h1 class="mb-4" th:text="${isEdit} ? 'Editar competidor' : 'Nuevo competidor'">Formulario</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{${formAction}}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="name" class="form-control" required
                           th:value="${competitor?.name}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Nickname</label>
                    <input type="text" name="nickname" class="form-control" required
                           th:value="${competitor?.nickname}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select name="type" class="form-select" required>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"
                                th:selected="${competitor != null and competitor.type == t}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Fecha de nacimiento</label>
                    <input type="date" name="birthDate" class="form-control"
                           th:value="${competitor?.birthDate}">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">Peso (kg)</label>
                        <input type="number" step="0.1" name="weight" class="form-control" required
                               th:value="${competitor?.weight}">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Altura (m)</label>
                        <input type="number" step="0.01" name="height" class="form-control" required
                               th:value="${competitor?.height}">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">País de origen</label>
                    <input type="text" name="originCountry" class="form-control"
                           th:value="${competitor?.originCountry}">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/competitors}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
