<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: common-head(${race.name})"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}">
        <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h1 th:text="${race.name}">Carrera</h1>
            <p class="text-muted" th:text="${race.description}">descripción</p>
        </div>
        <div class="text-end">
            <span class="badge fs-6 badge-status d-block mb-2"
                  th:classappend="${race.status.name() == 'COMPLETED'} ? 'bg-success' : (${race.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-info')"
                  th:text="${race.status}">estado</span>
            <!-- NUEVO: botón de editar. Solo tiene sentido si la carrera no
                 está COMPLETED/CANCELLED, coherente con la regla de negocio
                 del backend ("A completed race cannot be edited"). -->
            <a sec:authorize="hasAnyRole('ADMIN','ORGANIZER')"
               th:if="${race.status.name() != 'COMPLETED' and race.status.name() != 'CANCELLED'}"
               th:href="@{/races/{id}/edit(id=${race.id})}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-pencil"></i> Editar
            </a>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body row">
            <div class="col-md-3"><strong>Fecha:</strong><br th:text="${#temporals.format(race.scheduledAt, 'dd/MM/yyyy HH:mm')}"></div>
            <div class="col-md-3"><strong>Distancia:</strong><br th:text="${race.distanceMeters} + ' m'"></div>
            <div class="col-md-3"><strong>Tipo:</strong><br th:text="${race.type}"></div>
            <div class="col-md-3"><strong>Máx. participantes:</strong><br th:text="${race.maxParticipants}"></div>
        </div>
    </div>

    <div class="card mb-3" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')">
        <div class="card-header">Acciones sobre la carrera</div>
        <div class="card-body d-flex gap-2 flex-wrap">
            <form th:if="${race.status.name() == 'DRAFT'}" th:action="@{/races/{id}/status(id=${race.id})}" method="post">
                <input type="hidden" name="status" value="OPEN_FOR_REGISTRATION">
                <button class="btn btn-outline-success">Abrir inscripciones</button>
            </form>
            <form th:if="${race.status.name() == 'OPEN_FOR_REGISTRATION'}" th:action="@{/races/{id}/status(id=${race.id})}" method="post">
                <input type="hidden" name="status" value="CLOSED_FOR_REGISTRATION">
                <button class="btn btn-outline-secondary">Cerrar inscripciones</button>
            </form>
            <form th:if="${race.status.name() == 'CLOSED_FOR_REGISTRATION'}" th:action="@{/races/{id}/status(id=${race.id})}" method="post">
                <input type="hidden" name="status" value="IN_PROGRESS">
                <button class="btn btn-outline-primary">Iniciar carrera</button>
            </form>
            <form th:if="${race.status.name() == 'IN_PROGRESS'}" th:action="@{/races/{id}/status(id=${race.id})}" method="post">
                <input type="hidden" name="status" value="COMPLETED">
                <button class="btn btn-success">Finalizar carrera</button>
            </form>
            <form th:if="${race.status.name() != 'COMPLETED' and race.status.name() != 'CANCELLED'}"
                  th:action="@{/races/{id}/status(id=${race.id})}" method="post"
                  onsubmit="return confirm('¿Cancelar esta carrera?');">
                <input type="hidden" name="status" value="CANCELLED">
                <button class="btn btn-outline-danger">Cancelar carrera</button>
            </form>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-md-6">
            <a th:href="@{/races/{id}/registrations(id=${race.id})}" class="btn btn-outline-dark w-100">
                <i class="bi bi-clipboard-check"></i> Ver inscripciones
            </a>
        </div>
        <div class="col-md-6">
            <a th:href="@{/races/{id}/results(id=${race.id})}" class="btn btn-outline-dark w-100">
                <i class="bi bi-flag-fill"></i> Ver resultados
            </a>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
