<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">🐫 Camel Racing</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
                <li class="nav-item"><a class="nav-link" th:href="@{/competitors}">Competidores</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/teams}">Equipos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/races}">Carreras</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/standings}">Standings</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/audit}"><i class="bi bi-shield-lock"></i> Auditoría</a>
                </li>
            </ul>
            <div class="d-flex align-items-center text-light" sec:authorize="isAuthenticated()">
                <span class="me-3">
                    <i class="bi bi-person-circle"></i>
                    <!-- CORREGIDO: ahora es un link real hacia /profile, antes
                         era solo texto plano sin enlace. -->
                    <a th:href="@{/profile}" class="text-light text-decoration-none" sec:authentication="name">usuario</a>
                    <span class="badge bg-secondary ms-1" sec:authentication="authorities">rol</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
