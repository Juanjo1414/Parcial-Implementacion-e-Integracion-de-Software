<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: common-head('Mi perfil')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container" style="max-width: 500px;">
    <h1 class="mb-4">Mi perfil</h1>
    <div class="card">
        <div class="card-body">
            <p><strong>Usuario:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>Rol:</strong> <span class="badge bg-primary" th:text="${user.role}"></span></p>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
