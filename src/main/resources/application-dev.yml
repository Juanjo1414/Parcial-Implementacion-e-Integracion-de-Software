# Perfil "dev": Postgres corriendo en tu propia máquina (localhost).
# Usa variables de entorno para las credenciales -> nunca hardcodees aquí
# una contraseña real, este archivo se versiona en git.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/camelracing_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # actualiza las tablas automáticamente mientras se realiza el desarrollo
    show-sql: true

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-never-use-this-in-production-min-32-chars}
  expiration-ms: 3600000   # 1 hora, en milisegundos