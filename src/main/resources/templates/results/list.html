<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head :: common-head('Resultados')"></head>
<body>
<div th:replace="fragments/layout :: nav"></div>
<main class="container">
    <div class="alert alert-success alert-dismissible fade show" th:if="${successMessage}">
        <span th:text="${successMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <p><a th:href="@{/races/{id}(id=${race.id})}"><i class="bi bi-arrow-left"></i> Volver a la carrera</a></p>
    <h1 class="mb-4">Resultados — <span th:text="${race.name}">carrera</span></h1>

    <div class="card mb-3" sec:authorize="hasAnyRole('ADMIN','ORGANIZER')" th:if="${race.status.name() == 'IN_PROGRESS'}">
        <div class="card-header">Registrar resultado</div>
        <div class="card-body">
            <p class="text-muted small" th:if="${pendingRegistrations.isEmpty()}">
                Todos los participantes aprobados ya tienen un resultado registrado.
            </p>
            <form th:unless="${pendingRegistrations.isEmpty()}" th:action="@{/races/{id}/results(id=${race.id})}" method="post" class="row g-2">
                <div class="col-md-4">
                    <label class="form-label">Participante</label>
                    <select name="registrationId" class="form-select" required>
                        <option th:each="reg : ${pendingRegistrations}" th:value="${reg.id}"
                                th:text="${reg.competitorNickname} ?: ${reg.teamName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Estado</label>
                    <select name="status" class="form-select" required id="statusSelect" onchange="toggleFinishedFields()">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-2" id="positionField">
                    <label class="form-label">Posición</label>
                    <input type="number" name="finalPosition" class="form-control" min="1">
                </div>
                <div class="col-md-2" id="timeField">
                    <label class="form-label">Tiempo (seg)</label>
                    <input type="number" step="0.1" name="completionTimeSeconds" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Penalización</label>
                    <input type="number" step="0.1" name="penaltyTimeSeconds" class="form-control" value="0">
                </div>
                <div class="col-12">
                    <label class="form-label">Notas</label>
                    <input type="text" name="notes" class="form-control">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Registrar</button>
                </div>
            </form>
            <script>
                // Si el estado no es FINISHED, ocultamos posición/tiempo -- coherente
                // con la regla de negocio del backend (un DSQ/DNF no lleva posición).
                function toggleFinishedFields() {
                    const isFinished = document.getElementById('statusSelect').value === 'FINISHED';
                    document.getElementById('positionField').style.display = isFinished ? '' : 'none';
                    document.getElementById('timeField').style.display = isFinished ? '' : 'none';
                }
            </script>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <p class="empty-state mb-0" th:if="${results.isEmpty()}">Aún no hay resultados registrados.</p>
            <table class="table mb-0" th:unless="${results.isEmpty()}">
                <thead class="table-light"><tr><th>Posición</th><th>Participante</th><th>Tiempo</th><th>Estado</th><th>Puntos</th></tr></thead>
                <tbody>
                <tr th:each="r : ${results}">
                    <td th:text="${r.finalPosition} ?: '-'">1</td>
                    <td th:text="${r.participantLabel}">nombre</td>
                    <td th:text="${r.completionTimeSeconds} ?: '-'">tiempo</td>
                    <td><span class="badge bg-secondary" th:text="${r.status}">estado</span></td>
                    <td><strong th:text="${r.points}">0</strong></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
